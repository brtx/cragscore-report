<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CragScore - Basler Jura (PR #22: fenster-6h-mittelwert @ 1f39f0)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --rock: #2b2622; --paper: #f5f2ec; --line: #d8d2c6; --card: #fff;
    --good: #2e7d46; --fair: #b98a1d; --poor: #b0432f; --mute: #8a8072; --guess: #b98a1d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--rock);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
         padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  header { padding: 18px 16px 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--mute); font-weight: 400; }
  .sub { color: var(--mute); font-size: 12px; margin-top: 4px; }

  /* Am unteren Bildschirmrand fixiert: die drei meistgenutzten Controls (Liste, Karte,
     Tages-Filter) bleiben beim Scrollen immer erreichbar - body-padding-bottom oben haelt die
     letzte Karte/den Footer frei. z-index 1001: Leaflets eigene Panes (Kacheln, Marker, Popups,
     Zoom-Controls) liegen intern zwischen 200 und 1000 (siehe leaflet.css) und wuerden die Leiste
     sonst ueberdecken, sobald die 70vh-Karte bis in ihren Bereich reicht - nicht Safaris Toolbar
     wie zunaechst angenommen, sondern die Karte selbst lag vor den Buttons. */
  .tabs { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
          position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001;
          background: var(--paper); border-top: 1px solid var(--line);
          padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .tab { flex: 1; padding: 9px; text-align: center; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); font-size: 14px; font-weight: 600;
         color: var(--mute); cursor: pointer; }
  .tab.active { background: var(--rock); color: var(--paper); border-color: var(--rock); }

  /* Filter-Dropdown im gleichen Pill-Stil wie die Tabs: natives <select> ohne eigenes Aussehen,
     Kalender-Icon links und ein Caret rechts (gleiche Glyphe wie der Detail-Caret) simulieren die
     fehlende Icon-Faehigkeit eines <select>. */
  .filter-wrap { position: relative; display: flex; align-items: center; flex: 1.3; }
  .filter-ico { position: absolute; left: 10px; font-size: 13px; pointer-events: none; color: var(--mute); }
  .filter-wrap::after { content: '▾'; position: absolute; right: 10px; font-size: 11px;
                         color: var(--mute); pointer-events: none; }
  #dayFilter { appearance: none; -webkit-appearance: none; width: 100%;
               padding: 9px 26px 9px 30px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--card); font-size: 14px; font-weight: 600; color: var(--mute); }
  #dayFilter:focus { outline: none; border-color: var(--rock); }

  main { padding: 0 16px 40px; }

  /* Kartenansicht fixiert statt Teil der scrollenden Seite: top/bottom setzt sizeMapView() (JS)
     auf die tatsaechlich gemessene Luecke zwischen Content-Anfang und der unteren Tab-Leiste, die
     Karte fuellt also exakt den verfuegbaren Platz, egal wie hoch Header/Vorschau-Banner gerade
     sind. min-height greift nur, falls sizeMapView() aus irgendeinem Grund nie laeuft (top/bottom
     blieben dann leer) - ohne das wuerde #map (height:100%) sonst lautlos auf 0px kollabieren. */
  #mapView { position: fixed; left: 0; right: 0; z-index: 5; background: var(--paper);
             padding: 6px 16px; overflow: hidden; min-height: 50vh; }
  #map { height: 100%; width: 100%; border-radius: 8px; }
  .map-msg { padding: 40px 16px; text-align: center; color: var(--mute); font-size: 13px; }

  /* Trennzeile vor dem Block der ungeprueften (geratenen) Crags - grenzt sie sichtbar von der
     verlaesslichen Rangfolge ab, statt sie einfach ans Ende der Liste rutschen zu lassen. */
  .group-sep { margin: 18px 0 8px; padding-top: 10px; border-top: 1px dashed var(--line);
               font-size: 12px; font-weight: 600; color: var(--guess); text-transform: uppercase;
               letter-spacing: 0.02em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline;
               cursor: pointer; gap: 8px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-note { color: var(--mute); font-size: 12px; margin-top: 6px; }
  .caret { color: var(--mute); font-size: 12px; align-self: center; }
  .aspect { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--mute);
            border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px 1px 4px;
            margin-left: 6px; vertical-align: 2px; }
  .aspect .arrow { display: inline-block; font-size: 12px; line-height: 1; }

  /* Kleines, klickbares Sprung-Icon zwischen Liste und Karte - gleiche gedaempfte Optik wie
     .aspect, aber ohne Rahmen (soll neben dem Namen nicht wie ein weiteres Badge wirken). */
  .jump-icon { font-size: 14px; cursor: pointer; padding: 2px 4px; margin-left: 4px; color: var(--mute); }
  .jump-icon:active { opacity: 0.6; }

  .strip { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .day { flex: 0 0 auto; min-width: 64px; border-radius: 6px; padding: 5px 6px;
         font-size: 11px; text-align: center; color: #fff; opacity: 0.4; }
  .day.selected { opacity: 1; }
  .day .ico { font-size: 22px; line-height: 1.3; margin-bottom: 1px; }
  .day .d { font-size: 15px; font-weight: 700; text-transform: uppercase; opacity: 1; margin-bottom: 2px; }
  .day .v { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .day .sc { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.9; margin-top: 1px; }
  .day .t { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.85; }
  .s-good { background: var(--good); }
  .s-fair { background: var(--fair); }
  .s-poor { background: var(--poor); }
  .s-none { background: var(--mute); }
  .pct-good { color: var(--good); font-weight: 700; }
  .pct-fair { color: var(--fair); font-weight: 700; }
  .pct-poor { color: var(--poor); font-weight: 700; }

  .detail { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .detail.open { display: block; }

  /* Pflegestand als 5-Schritt-Leiter (New..Calibrated). Jeder Schritt ein Punkt mit Verbindungs-
     linie zum Vorgaenger (::before, deshalb kein Rand am ersten Schritt); erledigte Schritte und
     ihre Linie werden dunkel eingefaerbt, der aktuelle zusaetzlich in --good hervorgehoben. */
  .status-block { margin-bottom: 12px; }
  .ladder { display: flex; margin-bottom: 6px; }
  .ladder .step { flex: 1; position: relative; text-align: center; font-size: 10px;
                  color: var(--mute); cursor: default; }
  .ladder .step:not(:first-child)::before {
    content: ''; position: absolute; top: 5px; left: -50%; width: 100%; height: 2px;
    background: var(--line); z-index: 0; }
  .ladder .step.done:not(:first-child)::before { background: var(--rock); }
  .ladder .dot { display: block; width: 12px; height: 12px; margin: 0 auto 3px; border-radius: 50%;
                 background: var(--card); border: 2px solid var(--line); position: relative; z-index: 1; }
  .ladder .step.done .dot { background: var(--rock); border-color: var(--rock); }
  .ladder .step.current .dot { background: var(--good); border-color: var(--good); }
  .ladder .step.current .lbl { color: var(--rock); font-weight: 700; }
  .step-next { font-size: 12px; }

  .day-block { margin-bottom: 10px; }
  .day-block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
                  color: var(--mute); margin: 0 0 4px; }
  table.hours { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.hours th, table.hours td { padding: 3px 5px; text-align: right; border-bottom: 1px solid var(--line); }
  table.hours th:first-child, table.hours td:first-child { text-align: left; }

  .measured, .params { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #f0ece2;
                        font-size: 12px; }
  .measured .label, .params .label { font-weight: 600; }
  .params.guess { background: #fbf3e2; }
  .params .src { float: right; color: var(--guess); font-weight: 600; }
  .params.guess .src { color: var(--guess); }

  footer { padding: 10px 16px 40px; color: var(--mute); font-size: 12px; }

  .preview-banner { background: var(--guess); color: #fff; font-size: 12px; font-weight: 600;
                     text-align: center; padding: 6px 16px; letter-spacing: 0.02em; }
</style>
</head>

// Stabile ID je Crag fuer die Liste<->Karte-Spruenge - data.Crags wird von BuildJson() nie
// umsortiert, nur eine abgeleitete Kopie in render() (ranked) wird sortiert und haelt dieselben
// Objekt-Referenzen, die Idx bleibt also auch nach dem Sortieren gueltig.
data.Crags.forEach((c, i) => c.Idx = i);

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

// Eine einzige Definition von "was zaehlt als gut" - fuer Tages-Badges, Kartenmarker und die
// Prozentwerte in der Stunden-Detailtabelle gleichermassen (Prefix waehlt Hintergrund vs. Text).
function band(pct, prefix) {
  if (pct >= 70) return `${prefix}-good`;
  if (pct >= 40) return `${prefix}-fair`;
  if (pct > 0) return `${prefix}-poor`;
  return prefix === 's' ? 's-none' : `${prefix}-poor`;
}

document.getElementById('sub').textContent =
  `Erstellt ${new Date(data.GeneratedAt).toLocaleString('de-CH')}`;

// --- Zeitfenster-Filter: tagesgenau (Chips waehlen eine Teilmenge von data.Days). Wochenende/
// Zeitraum ergaben bei einem offenen Prognosehorizont Sinn, seit OpenMeteoClient aber fest auf
// die naechsten 5 Tage begrenzt (siehe forecastDays-Default), reicht ein Chip pro Tag: die ersten
// beiden heissen Heute/Morgen, die restlichen tragen ihren Wochentagsnamen - passt sich also von
// selbst an data.Days an statt einen fixen Satz Chips (Wochenende/Zeitraum) zu pflegen.
let selectedDays = null;   // null = alle Tage

function buildFilters() {
  const box = document.getElementById('filters');
  const dayLabel = i => i === 0 ? 'Heute' : i === 1 ? 'Morgen' :
    new Date(data.Days[i] + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long' });
  const options = [
    { key: 'all', label: 'Alle Tage' },
    ...data.Days.map((d, i) => ({ key: d, label: dayLabel(i) })),
  ];
  box.innerHTML = `<span class="filter-ico">📅</span>
    <select id="dayFilter">${options.map(o => `<option value="${esc(o.key)}">${esc(o.label)}</option>`).join('')}</select>`;
  document.getElementById('dayFilter').onchange = e => {
    selectedDays = e.target.value === 'all' ? null : [e.target.value];
    render();
  };
}

// --- Sortierung/Fit im gewaehlten Zeitraum: Summe der Tages-Mittelwerte (Fenster-Score) - reine
// Arithmetik auf den vorberechneten Fenster-Werten, die eigentliche Score-Formel lebt nur in
// ScoreModel (C#), nicht hier.
function fitFor(crag, days) {
  const set = days ? new Set(days) : null;
  const relevant = crag.Days.filter(d => !set || set.has(d.Date));
  const fit = relevant.reduce((sum, d) => sum + (d.Window?.MeanScore ?? 0), 0);
  const bestScore = relevant.reduce((m, d) => Math.max(m, d.Window?.MeanScore ?? 0), 0);
  return { fit, bestScore };
}

// WMO-Wettercode (Open-Meteo &weather_code, dieselbe Klassifikation wie MeteoSchweiz) -> Symbol.
// Gruppiert grob nach WMO-Konvention: 0 klar, 1-3 zunehmend bewoelkt, 45/48 Nebel, 51-57 Niesel,
// 61-67 Regen, 71-77 Schnee, 80-82 Regenschauer, 85/86 Schneeschauer, 95-99 Gewitter.
function wmoIcon(code) {
  if (code == null) return '';
  if (code === 0) return '☀';
  if (code === 1) return '🌤';
  if (code === 2) return '⛅';
  if (code === 3) return '☁';
  if (code === 45 || code === 48) return '🌫';
  if (code >= 51 && code <= 57) return '🌦';
  if (code >= 61 && code <= 67) return '🌧';
  if (code >= 71 && code <= 77) return '❄';
  if (code >= 80 && code <= 82) return '🌦';
  if (code === 85 || code === 86) return '❄';
  if (code >= 95) return '⛈';
  return '';
}

function renderStrip(crag, days) {
  const set = days ? new Set(days) : null;
  return data.Days.map(dateStr => {
    const day = crag.Days.find(d => d.Date === dateStr);
    const selected = !set || set.has(dateStr);
    const label = new Date(dateStr + 'T00:00:00')
      .toLocaleDateString('de-CH', { weekday: 'short' });
    if (!day) return `<div class="day s-none ${selected ? 'selected' : ''}">
      <div class="ico">&nbsp;</div><div class="d">${label}</div><div class="v">-</div>
      <div class="sc">&nbsp;</div><div class="t">&nbsp;</div></div>`;
    const w = day.Window;
    // Fenster-Uhrzeit und Score sind zwei getrennte Aussagen (wann vs. wie gut) - beide eigene
    // Zeilen statt einer, die sich gegenseitig ausschliesst. Farbe nach dem Mittelwert (dieselbe
    // 0..100-Skala wie die Stunden-Prozentwerte in der Detailtabelle).
    const dayBand = band(w?.MeanScore ?? 0, 's');
    const windowTxt = w ? `${w.Start.slice(0, 2)}–${w.End.slice(0, 2)}h` : '–';
    const scoreTxt = w ? `⌀${w.MeanScore.toFixed(0)} (${w.MinScore.toFixed(0)}–${w.MaxScore.toFixed(0)})` : '';
    const icon = wmoIcon(day.WeatherCode);
    const temps = day.TempMin != null && day.TempMax != null
      ? `${Math.round(day.TempMin)}°|${Math.round(day.TempMax)}°` : '';
    return `<div class="day ${dayBand} ${selected ? 'selected' : ''}">
      <div class="ico">${icon || '&nbsp;'}</div>
      <div class="d">${esc(label)}</div><div class="v">${esc(windowTxt)}</div>
      <div class="sc">${esc(scoreTxt) || '&nbsp;'}</div>
      <div class="t">${esc(temps) || '&nbsp;'}</div></div>`;
  }).join('');
}

// Fuenf Stufen des Pflegeprozesses (CragProgress.EffectiveStatus in Models.cs), als Leiter mit
// erledigten/aktuellem/offenen Schritten gerendert - dieselbe Reihenfolge wie CragStatus.
const STATUS_STEPS = ['New', 'Located', 'Terrain', 'Tuned', 'Calibrated'];
const STATUS_GLOSS = {
  New: 'nur Name bekannt',
  Located: 'Koordinate verifiziert',
  Terrain: 'Gelände aus swissALTI3D',
  Tuned: 'Erfahrungswerte gesetzt',
  Calibrated: 'gegen Besuche kalibriert',
};

function renderLadder(crag) {
  const idx = STATUS_STEPS.indexOf(crag.Status);
  const steps = STATUS_STEPS.map((s, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'current' : '';
    return `<div class="step ${cls}" title="${esc(STATUS_GLOSS[s])}">
      <span class="dot"></span><span class="lbl">${esc(s)}</span></div>`;
  }).join('');
  // NextStep kommt fertig formatiert aus CragProgress (Models.cs, z.B. "-> --terrain") - das
  // Praefix hier abschneiden, sonst zeigt die Zeile den Pfeil doppelt.
  const nextText = crag.NextStep ? crag.NextStep.replace(/^->\s*/, '') : '';
  const next = nextText ? `<div class="step-next">→ Nächster Schritt: ${esc(nextText)}</div>` : '';
  return `<div class="status-block"><div class="ladder">${steps}</div>${next}</div>`;
}

// Gemessen (Klasse A, aus --terrain) + Erfahrungswerte (Klasse B, mit Herkunft) - dieselben zwei
// Boxen fuer die Kartendetailansicht UND das Karten-Popup (drawMap), damit beide Ansichten nie
// unterschiedliche Werte zeigen koennen.
function renderValueBoxes(crag) {
  const isGuess = crag.ExperienceSource === 'Guess';

  const measured = `
    <div class="measured">
      <span class="label">Terrain (${esc(crag.TerrainSource)})</span><br>
      Höhe ${crag.ElevationM != null ? crag.ElevationM + ' m' : '–'} ·
      Exposition ${crag.Aspect ? `${esc(crag.Aspect)} (${Math.round(crag.AspectDeg)}°)` : '–'} ·
      Horizont ${crag.HorizonDeg != null ? crag.HorizonDeg + '°' : '–'}<br>
      <span class="label">Standort (${esc(crag.CoordinateSource)})</span><br>
      Koordinaten ${crag.Lat != null ? `${crag.Lat.toFixed(5)}, ${crag.Lon.toFixed(5)}` : '–'}
    </div>`;

  const params = `
    <div class="params ${isGuess ? 'guess' : ''}">
      <span class="label">Erfahrungswerte</span><span class="src">${esc(crag.ExperienceSource)}</span><br>
      RainExposure ${crag.RainExposure} · TauBaseHours ${crag.TauBaseHours} ·
      SeepageProne ${crag.SeepageProne ? 'ja' : 'nein'} · SunHeatFactor ${crag.SunHeatFactor}
      ${isGuess ? '<br><em>ungeprüft – geraten, noch nicht gegen Beobachtung kalibriert</em>' : ''}
    </div>`;

  return measured + params;
}

function renderDetail(crag) {
  const note = crag.Note ? `<div class="card-note">${esc(crag.Note)}</div>` : '';

  const byDate = {};
  crag.Hours.forEach(h => {
    const d = h.Time.slice(0, 10);
    (byDate[d] ??= []).push(h);
  });

  const days = Object.keys(byDate).sort().map(d => `
    <div class="day-block">
      <h4>${new Date(d + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit' })}</h4>
      <table class="hours">
        <tr><th>Zeit</th><th>Score</th><th>Fels°C</th><th>f_temp</th><th>f_dry</th><th>f_hum</th><th>Nässe</th><th>Sonne</th></tr>
        ${byDate[d].map(h => `<tr>
          <td>${h.Time.slice(11, 16)}</td>
          <td class="${band(h.Score, 'pct')}">${h.Score.toFixed(0)}%</td>
          <td>${h.RockTempC.toFixed(1)}</td>
          <td class="${band(h.FTemp * 100, 'pct')}">${(h.FTemp * 100).toFixed(0)}%</td>
          <td class="${band(h.FDry * 100, 'pct')}">${(h.FDry * 100).toFixed(0)}%</td>
          <td class="${band(h.FHum * 100, 'pct')}">${(h.FHum * 100).toFixed(0)}%</td>
          <td>${h.WetnessMm.toFixed(2)}</td>
          <td>${h.SunOnWall ? '☀' : '·'}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('');

  return renderLadder(crag) + renderValueBoxes(crag) + note + days;
}

function render() {
  const list = document.getElementById('listView');
  // Ungeprüfte (geratene) Crags gehoeren nicht in dieselbe Rangfolge wie beobachtete - ihr Score
  // ruht auf Default-Werten, nicht auf Erfahrung. Deshalb primär nach isGuess sortieren (Guess
  // immer zuletzt), erst innerhalb der beiden Gruppen nach Fit/BestScore.
  const ranked = data.Crags
    .map(c => ({ crag: c, isGuess: c.ExperienceSource === 'Guess', ...fitFor(c, selectedDays) }))
    .sort((a, b) => (a.isGuess - b.isGuess) || (b.fit - a.fit) || (b.bestScore - a.bestScore));

  const renderCard = crag => {
    const isGuess = crag.ExperienceSource === 'Guess';
    const hasCoords = crag.Lat != null && crag.Lon != null;
    return `
    <div class="card ${isGuess ? 'guess' : ''}" id="crag-${crag.Idx}" data-name="${esc(crag.Name)}">
      <div class="card-head" onclick="toggleDetail(this)">
        <div>
          <div class="card-name">${esc(crag.Name)}
            ${hasCoords ? `<span class="jump-icon" title="Auf der Karte zeigen" onclick="event.stopPropagation(); focusCragOnMap(${crag.Idx})">🗺</span>` : ''}
            ${crag.Aspect ? `<span class="aspect" title="Exposition ${esc(crag.Aspect)} (${Math.round(crag.AspectDeg)}°)">
              <span class="arrow" style="transform: rotate(${crag.AspectDeg}deg)">↑</span>${esc(crag.Aspect)}</span>` : ''}</div>
        </div>
        <div class="caret">▾</div>
      </div>
      <div class="strip">${renderStrip(crag, selectedDays)}</div>
      <div class="detail">${renderDetail(crag)}</div>
    </div>`;
  };

  // Trennzeile zwischen geprueften und ungeprueften Crags einfuegen - nur wenn es von beiden
  // Sorten welche gibt, sonst wuerde eine leere Gruppe eine nutzlose Ueberschrift bekommen.
  const firstGuessIdx = ranked.findIndex(r => r.isGuess);
  const parts = [];
  ranked.forEach((r, i) => {
    if (i === firstGuessIdx && firstGuessIdx > 0) {
      parts.push(`<div class="group-sep">Ungeprüft (geraten) – noch nicht gegen Beobachtung kalibriert</div>`);
    }
    parts.push(renderCard(r.crag));
  });
  list.innerHTML = parts.join('');
}

window.toggleDetail = function (headEl) {
  const card = headEl.closest('.card');
  const detail = card.querySelector('.detail');
  const nowOpen = !detail.classList.contains('open');
  detail.classList.toggle('open', nowOpen);
  headEl.querySelector('.caret').textContent = nowOpen ? '▴' : '▾';
};

// --- Tabs: die Liste braucht Leaflet nie, die Karte laedt es erst beim ersten Umschalten -
// ein blockiertes/fehlendes CDN darf die Liste nicht beeintraechtigen. switchTab() ist eine
// benannte Funktion (statt eines anonymen Click-Handlers), damit auch die Spruung-Icons
// (Liste<->Karte je Crag) dieselbe Umschaltung ausloesen koennen.
let mapReady = false;
let mapInstance = null;
let markersByIdx = {};

// #mapView ist fixiert (kein Scrollen der Kartenansicht) und misst sich an dem, was tatsaechlich
// zwischen Seitenanfang (nach Header/Vorschau-Banner) und der unteren Tab-Leiste frei ist - top/
// bottom statt einer festen Hoehe, damit die Karte automatisch so gross wie moeglich bleibt, egal
// wie hoch Header/Banner gerade ausfallen.
function sizeMapView() {
  const top = document.querySelector('main').getBoundingClientRect().top;
  const bottom = window.innerHeight - document.querySelector('.tabs').getBoundingClientRect().top;
  const mapView = document.getElementById('mapView');
  mapView.style.top = Math.max(0, top) + 'px';
  mapView.style.bottom = Math.max(0, bottom) + 'px';
}
window.addEventListener('resize', () => {
  if (document.getElementById('mapView').style.display !== 'none') {
    sizeMapView();
    if (mapInstance) mapInstance.invalidateSize();
  }
});

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  const isMap = name === 'map';
  document.getElementById('listView').style.display = isMap ? 'none' : '';
  document.getElementById('mapView').style.display = isMap ? '' : 'none';
  // <main> faellt bei ausgeblendeter Liste in sich zusammen (die fixierte Karte zaehlt nicht zum
  // Fluss) - der Footer wuerde sonst direkt unter den Header rutschen und dort nur deshalb
  // unsichtbar bleiben, weil die Karte optisch drueberliegt. Lieber explizit ausblenden statt sich
  // auf diese Zufaelligkeit der Stapelreihenfolge zu verlassen.
  document.querySelector('footer').style.display = isMap ? 'none' : '';
  // Seite darf nicht hinter der fixierten Karte wegscrollen - waehrend des Kartentabs bleibt sie
  // die einzige Interaktion (Pan/Zoom passiert in Leaflet selbst, nicht durch Seiten-Scroll).
  document.body.style.overflow = isMap ? 'hidden' : '';
  if (isMap) {
    sizeMapView();
    // mapReady wird schon in initMap() gesetzt (vor dem asynchronen Leaflet-Laden) - beim ERSTEN
    // Umschalten also initMap() anstossen, bei jedem weiteren invalidateSize(): die Karte war
    // zwischenzeitlich per display:none unsichtbar, Leaflet merkt eine Grössenaenderung des
    // eigenen Containers sonst nicht (klassische Leaflet-Falle, Ursache des Grau-Bugs beim
    // Sprung aus der Liste).
    if (!mapReady) initMap();
    else if (mapInstance) mapInstance.invalidateSize();
  }
}
document.querySelectorAll('.tab').forEach(tab => { tab.onclick = () => switchTab(tab.dataset.tab); });

// Springt von einer Crag-Karte in der Liste zur passenden Markierung auf der Karte - wartet per
// Poll auf mapInstance/den Marker, da initMap() Leaflet erst asynchron nachlaedt (mapReady wird
// dort synchron VOR dem Script-Load gesetzt, taugt also nicht als "Karte ist fertig"-Signal).
// Bricht nach ~8s ab, falls das CDN blockiert ist (dann greift showError() in initMap()).
let mapJumpPoll = null;
window.focusCragOnMap = function (idx) {
  switchTab('map');
  // Ein zweiter Klick (Doppeltipp) waehrend der erste Poll noch laeuft soll nicht zwei parallele
  // Intervalle aufziehen, die sich gegenseitig ueberholen - den laufenden Poll erst abbrechen.
  if (mapJumpPoll) clearInterval(mapJumpPoll);
  const tryFly = () => {
    const marker = markersByIdx[idx];
    if (!mapInstance || !marker) return false;
    mapInstance.setView(marker.getLatLng(), Math.max(mapInstance.getZoom(), 13));
    marker.openPopup();
    return true;
  };
  if (!tryFly()) {
    mapJumpPoll = setInterval(() => { if (tryFly()) clearInterval(mapJumpPoll); }, 60);
    setTimeout(() => clearInterval(mapJumpPoll), 8000);
  }
};

// Springt vom Karten-Popup zur passenden Karte in der Liste.
window.focusCragOnList = function (idx) {
  switchTab('list');
  const card = document.getElementById('crag-' + idx);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function initMap() {
  mapReady = true;
  const mapEl = document.getElementById('map');

  function showError() {
    mapEl.outerHTML = '<div class="map-msg" id="map">Karte nicht verfügbar (offline? unpkg.com blockiert?)</div>';
  }

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    try { drawMap(); } catch (e) { console.error(e); showError(); }
  };
  script.onerror = showError;
  document.body.appendChild(script);
}

function drawMap() {
  const located = data.Crags.filter(c => c.Lat != null && c.Lon != null);
  const center = located.length
    ? [located.reduce((s, c) => s + c.Lat, 0) / located.length,
       located.reduce((s, c) => s + c.Lon, 0) / located.length]
    : [47.45, 7.60];

  mapInstance = L.map('map').setView(center, located.length ? 12 : 10);

  // Drei Basiskarten wie im internen --map-Werkzeug (MapWriter.cs): OSM als Uebersicht, die
  // Swisstopo-Karten fuers Nachpruefen, ob ein Punkt wirklich auf der Wand sitzt und nicht auf
  // dem Plateau oder im Wald daneben.
  const swisstopoAttr = '&copy; <a href="https://www.swisstopo.admin.ch">swisstopo</a>';
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
  const pixelkarteLayer = L.tileLayer(
    'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom: 19, attribution: swisstopoAttr });
  const luftbildLayer = L.tileLayer(
    'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom: 19, attribution: swisstopoAttr });

  osmLayer.addTo(mapInstance);
  L.control.layers({ 'OpenStreetMap': osmLayer, 'Pixelkarte (swisstopo)': pixelkarteLayer,
                     'Luftbild (swisstopo)': luftbildLayer }).addTo(mapInstance);

  markersByIdx = {};
  located.forEach(c => {
    const set = selectedDays ? new Set(selectedDays) : null;
    const relevant = c.Days.filter(d => !set || set.has(d.Date));
    // Mittelwert der Fenster-Scores ueber die gewaehlten Tage - dieselbe 0..100-Skala wie die
    // Stunden-Prozentwerte, damit die Kartenfarbe zum Tages-Streifen passt.
    const avgBest = relevant.length ? relevant.reduce((s, d) => s + (d.Window?.MeanScore ?? 0), 0) / relevant.length : 0;
    const color = { 's-good': '#2e7d46', 's-fair': '#b98a1d', 's-poor': '#b0432f', 's-none': '#8a8072' }[band(avgBest, 's')];

    const marker = L.circleMarker([c.Lat, c.Lon], { radius: 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95 })
      .addTo(mapInstance)
      .bindPopup(`<b>${esc(c.Name)} <span class="jump-icon" title="In der Liste zeigen" onclick="focusCragOnList(${c.Idx})">☰</span></b><br>Score ${avgBest.toFixed(0)}${c.Note ? `<br><span style="color:#666">${esc(c.Note)}</span>` : ''}${renderValueBoxes(c)}`,
        { maxWidth: 260 });
    markersByIdx[c.Idx] = marker;
  });

  // Container kann beim allerersten Aufbau (schnell aus dem HTTP-Cache geladenes Leaflet-Script,
  // Groesse noch nicht final) knapp daneben liegen - hier zusaetzlich zu switchTab()s
  // invalidateSize() absichern, damit die Kacheln nie nur einen Teil der Flaeche fuellen. Erst
  // nach Layer/Markern statt direkt nach L.map(), damit auch deren Aufbau in die Neuberechnung
  // einfliesst statt nur die leere Karte.
  mapInstance.invalidateSize();
}

buildFilters();
render();
</script>
</body>
</html>
