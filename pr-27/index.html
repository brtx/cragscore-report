<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CragScore - Basler Jura (PR #27: claude/claude-md-conventions @ fd5347)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --rock: #2b2622; --paper: #f5f2ec; --line: #d8d2c6; --card: #fff;
    --good: #2e7d46; --fair: #b98a1d; --poor: #b0432f; --mute: #8a8072; --guess: #b98a1d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--rock);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
         padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  header { padding: 18px 16px 8px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--mute); font-weight: 400; }
  .sub { color: var(--mute); font-size: 12px; margin-top: 4px; }

  /* Burger-Menue oben rechts, buendig mit dem 16px-Content-Rand der Crag-Kacheln - ersetzt den
     frueheren Liste/Karte-Tab am unteren Rand (siehe .sliders unten), der Platz dort gehoert jetzt
     den beiden Fenster-Slidern. Menue selbst im gleichen Pill-Karten-Stil wie frueher die Tabs. */
  .menu-wrap { position: relative; flex: none; }
  .burger { font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--card); color: var(--rock); cursor: pointer; line-height: 1; }
  .menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
          background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          box-shadow: 0 4px 14px rgba(0,0,0,0.15); overflow: hidden; min-width: 130px; }
  .menu.open { display: block; }
  .menu-item { padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--mute);
               cursor: pointer; white-space: nowrap; }
  .menu-item.active { background: var(--rock); color: var(--paper); }

  /* Am unteren Bildschirmrand fixiert: die beiden Fenster-Slider (Laenge, Lage) bleiben beim
     Scrollen immer erreichbar - body-padding-bottom oben haelt die letzte Karte/den Footer frei.
     z-index 1001: Leaflets eigene Panes (Kacheln, Marker, Popups, Zoom-Controls) liegen intern
     zwischen 200 und 1000 (siehe leaflet.css) und wuerden die Leiste sonst ueberdecken, sobald die
     70vh-Karte bis in ihren Bereich reicht - nicht Safaris Toolbar wie zunaechst angenommen,
     sondern die Karte selbst lag vor den Buttons. */
  .sliders { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px;
             position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001;
             background: var(--paper); border-top: 1px solid var(--line);
             padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row .slider-label { flex: none; font-size: 12px; font-weight: 600; color: var(--mute);
                               width: 34px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--rock); }
  .slider-row .slider-value { flex: none; min-width: 96px; text-align: right;
                               font-size: 12px; font-weight: 600; color: var(--rock);
                               font-variant-numeric: tabular-nums; }

  main { padding: 0 16px 40px; }

  /* Kartenansicht fixiert statt Teil der scrollenden Seite: top/bottom setzt sizeMapView() (JS)
     auf die tatsaechlich gemessene Luecke zwischen Content-Anfang und der unteren Slider-Leiste,
     die Karte fuellt also exakt den verfuegbaren Platz, egal wie hoch Header/Vorschau-Banner gerade
     sind. min-height greift nur, falls sizeMapView() aus irgendeinem Grund nie laeuft (top/bottom
     blieben dann leer) - ohne das wuerde #map (height:100%) sonst lautlos auf 0px kollabieren. */
  #mapView { position: fixed; left: 0; right: 0; z-index: 5; background: var(--paper);
             padding: 6px 16px; overflow: hidden; min-height: 50vh; }
  #map { height: 100%; width: 100%; border-radius: 8px; }
  .map-msg { padding: 40px 16px; text-align: center; color: var(--mute); font-size: 13px; }

  /* Trennzeile vor dem Block der ungeprueften (geratenen) Crags - grenzt sie sichtbar von der
     verlaesslichen Rangfolge ab, statt sie einfach ans Ende der Liste rutschen zu lassen. */
  .group-sep { margin: 18px 0 8px; padding-top: 10px; border-top: 1px dashed var(--line);
               font-size: 12px; font-weight: 600; color: var(--guess); text-transform: uppercase;
               letter-spacing: 0.02em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline;
               cursor: pointer; gap: 8px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-note { color: var(--mute); font-size: 12px; margin-top: 6px; }
  .caret { color: var(--mute); font-size: 12px; align-self: center; }
  .aspect { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--mute);
            border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px 1px 4px;
            margin-left: 6px; vertical-align: 2px; }
  /* Expo als Fels-Grundriss von oben: der gefuellte Halbkreis ist der Fels, seine gerade Kante
     die Wand - rotate(AspectDeg) dreht die Kante in die Ausrichtung der Wand (ersetzt den
     frueheren Pfeil-Glyph, ADR-021). */
  .aspect .aspect-rock { width: 12px; height: 12px; fill: var(--mute); display: block; }

  /* Kleines, klickbares Sprung-Icon zwischen Liste und Karte - gleiche gedaempfte Optik wie
     .aspect, aber ohne Rahmen (soll neben dem Namen nicht wie ein weiteres Badge wirken). */
  .jump-icon { font-size: 14px; cursor: pointer; padding: 2px 4px; margin-left: 4px; color: var(--mute); }
  .jump-icon:active { opacity: 0.6; }

  /* Kontinuierlicher Score-Graph (renderGraph) - ersetzt den frueheren Tageskachel-Streifen
     (.strip/.day, siehe ADR-011/012 in DECISIONS.md). viewBox-Einheiten sind bewusst nah an
     echten Mobil-Breiten gewaehlt (siehe GRAPH_W in renderGraph), damit die font-size-Werte unten
     ungefaehr ihrer angegebenen Pixelgroesse entsprechen statt beim Hochskalieren auf 100%
     Kartenbreite winzig zu wirken. */
  .graph { width: 100%; height: auto; display: block; margin-top: 8px; }
  .band-good { fill: rgba(46, 125, 70, 0.12); }
  .band-fair { fill: rgba(185, 138, 29, 0.14); }
  .band-poor { fill: rgba(176, 67, 47, 0.12); }
  /* Nachtstunden: dezentes hellgrau meliertes Viertelmond-Muster (Pattern #night-moons, einmal
     zentral im Body definiert) statt der frueheren leeren Luecke - den Tageswechsel markiert seit
     ADR-021 wieder ein eigener Trenner (.grid-day). Bewusst blass, die Kurve bleibt die Aussage. */
  .band-night { fill: url(#night-moons); }
  .night-tint { fill: var(--mute); opacity: 0.05; }
  .night-moon { fill: var(--mute); opacity: 0.14; }
  .night-moon.dim { opacity: 0.08; }
  .grid-solid { stroke: var(--line); stroke-width: 0.35; }
  .grid-dotted { stroke: var(--line); stroke-width: 0.35; stroke-dasharray: 1.5 1.5; }
  .grid-hour { stroke: var(--line); stroke-width: 0.35; opacity: 0.7; }
  /* Tagestrenner (ADR-021): gleiche duenne Staerke wie die Stundenlinien - nicht die Dicke,
     sondern die groessere Laenge (bis ueber die Scorezeile hinauf) traegt die Bedeutung. */
  .grid-day { stroke: var(--line); stroke-width: 0.35; opacity: 0.7; }
  .axis-y { font-size: 6px; fill: var(--mute); font-variant-numeric: tabular-nums; }
  /* Kurve staerker als jede Rasterlinie (auch staerker als die Fenster-Raender) - sie ist die
     einzige Aussage, die immer lesbar bleiben muss, der Rest ist nur Orientierungshilfe. Insgesamt
     aber duenn und scharf gehalten (siehe Feedback: alte Linien wirkten zu fett/verwaschen). */
  .graph-curve { fill: none; stroke: var(--rock); stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
  /* Waagerechte Fenster-Linien (ADR-020): oben das beste Tagesfenster der gewaehlten Laenge, unten
     das frei platzierte gewaehlte Fenster - ersetzen die frueheren senkrechten Fensterraender,
     gleiche Strichstaerke wie diese. */
  .graph-window-line { stroke: var(--rock); stroke-width: 0.6; }
  /* Wochentag, Temp-Range und Fenster-Durchschnitt teilen bewusst exakt denselben Font (Groesse,
     Gewicht, Farbe) - keine der vier Zahlen/Woerter soll gegenueber den anderen wichtiger wirken. */
  .graph-wd, .graph-temp, .graph-window-avg { font-size: 14px; fill: var(--rock); font-variant-numeric: tabular-nums; }
  .graph-ico { font-size: 21px; }

  .pct-good { color: var(--good); font-weight: 700; }
  .pct-fair { color: var(--fair); font-weight: 700; }
  .pct-poor { color: var(--poor); font-weight: 700; }

  .detail { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .detail.open { display: block; }

  /* Pflegestand als 5-Schritt-Leiter (New..Calibrated). Jeder Schritt ein Punkt mit Verbindungs-
     linie zum Vorgaenger (::before, deshalb kein Rand am ersten Schritt); erledigte Schritte und
     ihre Linie werden dunkel eingefaerbt, der aktuelle zusaetzlich in --good hervorgehoben. */
  .status-block { margin-bottom: 12px; }
  .ladder { display: flex; margin-bottom: 6px; }
  .ladder .step { flex: 1; position: relative; text-align: center; font-size: 10px;
                  color: var(--mute); cursor: default; }
  .ladder .step:not(:first-child)::before {
    content: ''; position: absolute; top: 5px; left: -50%; width: 100%; height: 2px;
    background: var(--line); z-index: 0; }
  .ladder .step.done:not(:first-child)::before { background: var(--rock); }
  .ladder .dot { display: block; width: 12px; height: 12px; margin: 0 auto 3px; border-radius: 50%;
                 background: var(--card); border: 2px solid var(--line); position: relative; z-index: 1; }
  .ladder .step.done .dot { background: var(--rock); border-color: var(--rock); }
  .ladder .step.current .dot { background: var(--good); border-color: var(--good); }
  .ladder .step.current .lbl { color: var(--rock); font-weight: 700; }
  .step-next { font-size: 12px; }

  .day-block { margin-bottom: 10px; }
  .day-block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
                  color: var(--mute); margin: 0 0 4px; }
  table.hours { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.hours th, table.hours td { padding: 3px 5px; text-align: right; border-bottom: 1px solid var(--line); }
  table.hours th:first-child, table.hours td:first-child { text-align: left; }

  .measured, .params { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #f0ece2;
                        font-size: 12px; }
  .measured .label, .params .label { font-weight: 600; }
  .params.guess { background: #fbf3e2; }
  .params .src { float: right; color: var(--guess); font-weight: 600; }
  .params.guess .src { color: var(--guess); }

  footer { padding: 10px 16px 40px; color: var(--mute); font-size: 12px; }

  .preview-banner { background: var(--guess); color: #fff; font-size: 12px; font-weight: 600;
                     text-align: center; padding: 6px 16px; letter-spacing: 0.02em; }
</style>
</head>

<div class="preview-banner">Vorschau · PR #27: claude/claude-md-conventions @ fd5347</div>
<!-- Unsichtbares SVG nur fuer Pattern-Definitionen: jede Crag-Karte traegt ihr eigenes Inline-SVG,
     ein dort definiertes Pattern existierte also einmal pro Karte mit derselben ID. Deshalb einmal
     zentral hier - url(#night-moons) in .band-night loest dokumentweit auf. Zwei verschieden
     grosse, versetzte Monde je Kachel ergeben den melierten Eindruck. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="night-moons" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" class="night-tint"/>
      <path d="M 0 -2.2 A 2.2 2.2 0 0 0 0 2.2 A 3 3 0 0 1 0 -2.2 Z" class="night-moon" transform="translate(3 3)"/>
      <path d="M 0 -1.8 A 1.8 1.8 0 0 0 0 1.8 A 2.5 2.5 0 0 1 0 -1.8 Z" class="night-moon dim" transform="translate(9 9) rotate(40)"/>
    </pattern>
  </defs>
</svg>
<header>
  <div class="header-top">
    <div>
      <h1>CragScore <span>/ Basler Jura</span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="menu-wrap">
      <button class="burger" id="burgerBtn" type="button" aria-label="Ansicht wechseln">☰</button>
      <div class="menu" id="viewMenu">
        <div class="menu-item active" data-tab="list">☰ Liste</div>
        <div class="menu-item" data-tab="map">🗺 Karte</div>
      </div>
    </div>
  </div>
</header>

<div class="sliders" id="sliders"></div>

<main>
  <div id="listView"></div>
  <div id="mapView" style="display:none">
    <div id="map"></div>
  </div>
</main>

<footer>
  Prototyp. Wetter: Open-Meteo (MeteoSchweiz ICON-CH). Crag-Parameter in crags.json pflegen,
  Modellparameter in ScoreModel.cs. Zugangs- und Sperrsituation: igklettern-basel.ch.
</footer>

  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

// Prozentwerte in der Stunden-Detailtabelle gleichermassen (Prefix waehlt Hintergrund vs. Text).
function band(pct, prefix) {
  if (pct >= 70) return `${prefix}-good`;
  if (pct >= 40) return `${prefix}-fair`;
  if (pct > 0) return `${prefix}-poor`;
  return prefix === 's' ? 's-none' : `${prefix}-poor`;
}

document.getElementById('sub').textContent =
  `Erstellt ${new Date(data.GeneratedAt).toLocaleString('de-CH')}`;

// --- Fenster-Slider (ADR-020): ersetzt den frueheren Tagesfilter. Zwei rastende <input
// type=range>-Elemente statt Chips - Slider 1 (windowLen) bestimmt die Laenge sowohl des
// server-seitig je Tag vorberechneten besten Fensters (renderGraph, oben im Plot) als auch des
// hier frei platzierten "gewaehlten" Fensters (selStart, unten im Plot); Slider 2 verschiebt
// dessen Lage und steuert damit die Sortierung (frueher: der Tagesfilter). Aus
// ForecastPageWriter.WindowMinLengthHours/WindowMaxLengthHours (C#) interpoliert statt hier ein
// zweites Mal hingeschrieben - BuildJson berechnet die Best-Fenster nur fuer genau diesen
// Laengenbereich vor, zwei unabhaengige Literale koennten sonst unbemerkt auseinanderlaufen.
const WINDOW_MIN_LEN = 3, WINDOW_MAX_LEN = 9;
// Tageszeit-Grenzen fuer Slider 2 UND die Nacht-Bereiche mit Mond-Muster im Score-Graphen
// (renderGraph, weiter unten) - eine einzige Definition fuer beide, sonst koennten
// Slider-Rasterpunkte und die sichtbare Bandeinfaerbung unbemerkt auseinanderlaufen. Rein
// visuelle/UI-Konvention, bewusst
// nicht an ScoreModel.DayStartHour/DayEndHour (7/21, Tageslicht-Kontext der Detailtabelle)
// gekoppelt - die beschreiben, wann ein Kletterfenster beginnen darf, nicht wann es optisch Nacht
// wird.
const DAY_START_HOUR = 7, DAY_END_HOUR = 22;
const pad2 = n => String(n).padStart(2, '0');
// yyyy-mm-dd aus den *lokalen* Datumsfeldern eines Date - bewusst nicht toISOString() (das
// konvertiert nach UTC und wuerde bei Tagesrand-Stunden ein falsches Datum liefern). Alle
// Zeitstempel in data (crag.Hours[].Time, data.Days) sind naive lokale Wanduhrzeiten ohne
// Zeitzone - new Date(str) parst sie als lokale Zeit, hier also konsistent zurueckwandeln.
const localDateStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

let windowLen = 6;      // Slider 1: Laenge in Stunden, 3..9, Default 6h (ADR-020)
let selStart = null;    // Slider 2: gewaehlter Fensterstart (Date), Laenge = windowLen
let starts = [];         // gueltige Startzeiten fuer Slider 2 bei aktueller windowLen
// crag.Idx -> windowMean(crag, selStart, windowLen), einmal pro render() neu gefuellt (dort ganz
// am Anfang) statt je Verwendungsstelle (Sortierung, Graph-Label, Kartenmarker) erneut berechnet -
// sonst wuerde derselbe .map/.filter/.sort ueber crag.Hours bis zu dreimal pro Crag und Slider-Tick
// laufen.
let selCache = new Map();

// Gueltige Start-Stunden fuer Slider 2: nur ganze Stunden, deren Fenster [T, T+len] am selben Tag
// zwischen DAY_START_HOUR und DAY_END_HOUR bleibt - eine naechtliche Ueberschneidung wird so
// automatisch ausgeschlossen statt als eigener Sonderfall geprueft zu werden. Die Rasterpunkte
// sind dadurch tagesweise unterbrochen (Luecke ueber Nacht), deshalb indiziert Slider 2 diese
// gebaute Liste statt roher Stunden - ein natives step=1 ueber den Index ergibt trotzdem ein
// sauberes Einrasten.
function validStarts(len) {
  const result = [];
  data.Days.forEach(d => {
    for (let hh = DAY_START_HOUR; hh + len <= DAY_END_HOUR; hh++) result.push(new Date(`${d}T${pad2(hh)}:00:00`));
  });
  return result;
}

// Default = naechste waehlbare volle Stunde ab Browser-Jetzt; liegt Jetzt nach dem letzten
// Rasterpunkt (Prognosehorizont bereits vorbei), auf den letzten klemmen statt keinen zu waehlen.
function defaultStart(candidates) {
  return candidates.find(t => t >= new Date()) ?? candidates[candidates.length - 1] ?? null;
}

// Beim Laenge-Wechsel die bisherige Wahl beibehalten, wenn sie bei der neuen Laenge noch ein
// gueltiger Rasterpunkt ist, sonst klemmen - ein Reset auf den Default waere hier ueberraschend,
// der Nutzer hat diese Lage ja bewusst gewaehlt. Bevorzugt dabei einen Rasterpunkt am selben
// Kalendertag wie die bisherige Wahl (das ist die eigentliche Absicht: "bleib wo ich war, nur die
// Laenge aendert sich") und faellt erst auf den zeitlich naechstgelegenen Punkt insgesamt zurueck,
// wenn der Tag selbst keinen gueltigen Rasterpunkt mehr hat - ein reiner Zeit-Abstandsvergleich
// ohne diesen Tages-Vorrang koennte bei grosser Fensterlaenge sonst unbemerkt auf einen ganz
// anderen Tag springen.
function closestStart(candidates, target) {
  if (!target || candidates.length === 0) return defaultStart(candidates);
  const sameDay = candidates.filter(t => localDateStr(t) === localDateStr(target));
  const pool = sameDay.length > 0 ? sameDay : candidates;
  return pool.reduce((best, t) =>
    Math.abs(t - target) < Math.abs(best - target) ? t : best, pool[0]);
}

// Baut starts/selStart fuer die aktuelle windowLen neu auf (reine Daten, keine DOM-Zugriffe) -
// gemeinsame Stelle fuer den Erstaufbau (buildSliders, pickFn=defaultStart) und den
// Laenge-Slider-Handler (pickFn=closestStart mit der bisherigen Wahl), damit "starts und selStart
// bewegen sich immer zusammen" nicht an zwei Stellen einzeln nachgebaut werden muss.
function rebuildStarts(pickFn) {
  starts = validStarts(windowLen);
  selStart = pickFn(starts);
}

function buildSliders() {
  rebuildStarts(defaultStart);

  const box = document.getElementById('sliders');
  box.innerHTML = `
    <div class="slider-row">
      <span class="slider-label">Dauer</span>
      <input type="range" id="lenSlider" min="${WINDOW_MIN_LEN}" max="${WINDOW_MAX_LEN}" step="1" value="${windowLen}">
      <span class="slider-value" id="lenValue"></span>
    </div>
    <div class="slider-row">
      <span class="slider-label">Zeit</span>
      <input type="range" id="startSlider" min="0" max="0" step="1" value="0">
      <span class="slider-value" id="startValue"></span>
    </div>`;

  document.getElementById('lenSlider').oninput = e => {
    windowLen = Number(e.target.value);
    const prevStart = selStart;
    rebuildStarts(starts => closestStart(starts, prevStart));
    syncStartSlider();
    updateSliderLabels();
    render();
  };
  document.getElementById('startSlider').oninput = e => {
    selStart = starts[Number(e.target.value)] ?? null;
    updateSliderLabels();
    render();
  };

  syncStartSlider();
  updateSliderLabels();
}

function syncStartSlider() {
  const slider = document.getElementById('startSlider');
  slider.max = Math.max(0, starts.length - 1);
  const idx = selStart ? starts.findIndex(t => t.getTime() === selStart.getTime()) : 0;
  slider.value = Math.max(0, idx);
}

function updateSliderLabels() {
  document.getElementById('lenValue').textContent = `${windowLen} h`;
  const startValue = document.getElementById('startValue');
  if (!selStart) { startValue.textContent = '–'; return; }
  const end = new Date(selStart.getTime() + windowLen * 3600 * 1000);
  const wd = selStart.toLocaleDateString('de-CH', { weekday: 'short' });
  startValue.textContent = `${wd} ${pad2(selStart.getHours())}–${pad2(end.getHours())} Uhr`;
}

// Mittelwert der Stunden-Scores im Fenster [start, start+len] (kanteninklusiv, len+1 Werte) -
// bricht an einer echten Prognose-Luecke (>1.01h Abstand zwischen zwei aufeinanderfolgenden
// Stunden, wie ScoreModel.WindowFrom in ScoreModel.cs) ab statt darueber hinweg zu mitteln,
// dieselbe Semantik wie dort fuer das server-seitig vorberechnete Tages-Fenster - hier fuer das
// frei waehlbare Fenster in JS nachgebaut, weil dessen Lage (anders als die Tagesfenster) erst im
// Browser feststeht. Die Score-Kurve (renderGraph, "Score-Kurve"-Abschnitt) trennt Segmente an
// einer eigenen, groesseren 1.5h-Schwelle - beide beantworten zwar "ist das eine echte Luecke",
// aber zu unterschiedlichem Zweck (mathematische Fenster-Korrektheit hier vs. rein visuelle
// Linienkontinuitaet dort); absichtlich zwei verschiedene Werte, nicht angleichen.
function windowMean(crag, start, len) {
  if (!start) return null;
  const end = new Date(start.getTime() + len * 3600 * 1000);
  const pts = crag.Hours
    .map(h => ({ t: new Date(h.Time), score: h.Score }))
    .filter(p => p.t >= start && p.t <= end)
    .sort((a, b) => a.t - b.t);
  if (pts.length === 0) return null;
  for (let i = 1; i < pts.length; i++)
    if ((pts[i].t - pts[i - 1].t) > 1.01 * 3600 * 1000) return null;
  return pts.reduce((s, p) => s + p.score, 0) / pts.length;
}

// --- Sortierung/Kartenfarbe: Score des gewaehlten Fensters (Slider 2) - liest aus selCache statt
// windowMean() direkt aufzurufen, damit derselbe Wert nicht mehrfach pro render()-Durchlauf neu
// berechnet wird (siehe Kommentar bei selCache oben).
function selWindowScore(crag) { return selCache.get(crag.Idx) ?? 0; }

// WMO-Wettercode (Open-Meteo &weather_code, dieselbe Klassifikation wie MeteoSchweiz) -> Symbol.
// Gruppiert grob nach WMO-Konvention: 0 klar, 1-3 zunehmend bewoelkt, 45/48 Nebel, 51-57 Niesel,
// 61-67 Regen, 71-77 Schnee, 80-82 Regenschauer, 85/86 Schneeschauer, 95-99 Gewitter.
function wmoIcon(code) {
  if (code == null) return '';
  if (code === 0) return '☀';
  if (code === 1) return '🌤';
  if (code === 2) return '⛅';
  if (code === 3) return '☁';
  if (code === 45 || code === 48) return '🌫';
  if (code >= 51 && code <= 57) return '🌦';
  if (code >= 61 && code <= 67) return '🌧';
  if (code >= 71 && code <= 77) return '❄';
  if (code >= 80 && code <= 82) return '🌦';
  if (code === 85 || code === 86) return '❄';
  if (code >= 95) return '⛈';
  return '';
}

// Geometrie des Score-Graphen in SVG-viewBox-Einheiten. GRAPH_W ist bewusst nah an einer echten
// Mobil-Content-Breite (Handy minus Padding) gewaehlt statt einer grossen runden Zahl (z.B. 1000) -
// SVG-Text skaliert mit der viewBox mit, bei einem viel breiteren Koordinatensystem als der
// tatsaechlichen Bildschirmbreite wuerden die unten in Pixel angegebenen font-size-Werte beim
// Herunterskalieren auf 100% Kartenbreite unlesbar klein.
// HEADER_H traegt seit ADR-020 neben Wochentag/Icon/Temp auch noch die Scorezeile (Durchschnitt
// des besten Tagesfensters, siehe renderGraph) - deshalb 84 statt der frueheren 64. Seit ADR-021
// sitzt der Score nicht mehr mittig als vierte Kopfzeile, sondern direkt ueber seiner
// Fensterlinie an der Plot-Oberkante (SCORE_BASELINE unten), braucht aber weiter dieselbe Hoehe.
const GRAPH_W = 400, GUTTER = 16, HEADER_H = 84, PLOT_H = 50, FOOTER_H = 17, PAD = 2;
const GRAPH_H = PAD + HEADER_H + PLOT_H + FOOTER_H + PAD;
const PLOT_TOP = PAD + HEADER_H, PLOT_BOTTOM = PLOT_TOP + PLOT_H;
// Baseline der Scorezeile knapp ueber der besten-Fenster-Linie (PLOT_TOP); SCORE_ROW_TOP haengt
// davon ab (14px-Schrift plus etwas Luft) und begrenzt den Tagestrenner nach oben, damit er die
// Scorezeile mit erfasst statt an der Plotkante zu enden - kein zweites, unabhaengiges Literal.
const SCORE_BASELINE = PLOT_TOP - 4;
const SCORE_ROW_TOP = SCORE_BASELINE - 16;

// Score 0..100 -> y-Koordinate im Plotbereich (100 oben, 0 unten) - einzige Stelle, die diese
// Zuordnung kennt, sowohl Hintergrundbaender, Rasterlinien als auch Kurve und Fenster-Marker
// rechnen ueber diese eine Funktion, damit sie nie auseinanderlaufen koennen.
function scoreY(score) {
  return PLOT_TOP + PLOT_H * (1 - Math.max(0, Math.min(100, score)) / 100);
}

// Kontinuierlicher Score-Graph ueber alle Forecast-Tage (SwissMeteo-Vorbild) - ersetzt den
// frueheren Tageskachel-Streifen (renderStrip, siehe ADR-011/012 in DECISIONS.md). Die Tage
// liegen nahtlos nebeneinander (Tagesbreite = Plotbreite / Anzahl Tage, x-Position einer Stunde
// = Tagesanfang + Stunde/24 * Tagesbreite) - dadurch schliesst 23 Uhr eines Tages luecklos an
// 0 Uhr des naechsten an, ohne dass hier eine globale Stundenachse gefuehrt werden muss.
function renderGraph(crag, selMean) {
  const days = data.Days;
  if (days.length === 0) return `<svg class="graph" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}"></svg>`;

  const plotW = GRAPH_W - GUTTER;
  const dayW = plotW / days.length;
  const dayX = i => GUTTER + i * dayW;

  const byDate = {};
  crag.Hours.forEach(h => {
    const d = h.Time.slice(0, 10);
    (byDate[d] ??= []).push(h);
  });

  // --- Hintergrundbaender: rot/gelb/gruen nach denselben Schwellen wie band() (poor/fair/good).
  // Nachts (DAY_END_HOUR-DAY_START_HOUR) statt der Score-Farben ein dezentes Viertelmond-Muster
  // (ADR-021, .band-night) - den Tageswechsel markiert der Tagestrenner in der vgrid-Schleife
  // unten. DAY_START_HOUR/DAY_END_HOUR (oben, gemeinsam mit Slider 2) sind eine rein visuelle
  // Daemmerungs-Konvention und bewusst nicht an ScoreModel.DayStartHour/DayEndHour gekoppelt - die
  // beschreiben, wann ein Kletterfenster beginnen darf, nicht wann es optisch Nacht wird. ---
  const DAY_START_FRAC = DAY_START_HOUR / 24, DAY_END_FRAC = DAY_END_HOUR / 24;
  let bands = '';
  days.forEach((dateStr, i) => {
    const x0 = dayX(i);
    const xd0 = x0 + DAY_START_FRAC * dayW, xd1 = x0 + DAY_END_FRAC * dayW, w = xd1 - xd0;
    bands += `
      <rect x="${x0}" y="${scoreY(100)}" width="${xd0 - x0}" height="${scoreY(0) - scoreY(100)}" class="band-night"/>
      <rect x="${xd1}" y="${scoreY(100)}" width="${x0 + dayW - xd1}" height="${scoreY(0) - scoreY(100)}" class="band-night"/>
      <rect x="${xd0}" y="${scoreY(100)}" width="${w}" height="${scoreY(70) - scoreY(100)}" class="band-good"/>
      <rect x="${xd0}" y="${scoreY(70)}" width="${w}" height="${scoreY(40) - scoreY(70)}" class="band-fair"/>
      <rect x="${xd0}" y="${scoreY(40)}" width="${w}" height="${scoreY(0) - scoreY(40)}" class="band-poor"/>`;
  });

  // --- Waagerechte Rasterlinien: 50 durchgezogen, 25/75 gepunktet, 0/100 nur beschriftet (keine
  // Linie - das waeren sonst Kantenlinien am oberen/unteren Plotrand) ---
  const hgrid = [0, 25, 50, 75, 100].map(v => {
    const y = scoreY(v);
    const dotted = v === 25 || v === 75;
    const label = (v === 0 || v === 50 || v === 100)
      ? `<text x="${GUTTER - 3}" y="${y + 2}" class="axis-y" text-anchor="end">${v}</text>` : '';
    const line = (v === 0 || v === 100)
      ? '' : `<line x1="${GUTTER}" y1="${y}" x2="${GRAPH_W}" y2="${y}" class="${dotted ? 'grid-dotted' : 'grid-solid'}"/>`;
    return `${line}${label}`;
  }).join('');

  // --- Senkrechte Rasterlinien (6/12/18 Uhr, unbeschriftet) plus Tagestrenner um Mitternacht
  // (ADR-021): gleiche duenne Staerke, aber nach oben bis ueber die Scorezeile verlaengert und nur
  // *zwischen* den Tagen - am linken und rechten Graphrand grenzt nichts an nichts. Dazu die
  // Kopfzeile je Tag (Wochentag/Icon/Temp-Range). ---
  let vgrid = '', headers = '';
  days.forEach((dateStr, i) => {
    const x0 = dayX(i);
    [6, 12, 18].forEach(hh => {
      const x = x0 + (hh / 24) * dayW;
      vgrid += `<line x1="${x}" y1="${PLOT_TOP}" x2="${x}" y2="${PLOT_BOTTOM}" class="grid-hour"/>`;
    });
    if (i > 0) {
      vgrid += `<line x1="${x0}" y1="${SCORE_ROW_TOP}" x2="${x0}" y2="${PLOT_BOTTOM}" class="grid-day"/>`;
    }

    const day = crag.Days.find(d => d.Date === dateStr);
    const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'short' });
    const icon = day ? wmoIcon(day.WeatherCode) : '';
    const temps = day && day.TempMin != null && day.TempMax != null
      ? `${Math.round(day.TempMin)}° | ${Math.round(day.TempMax)}°` : '';
    const cx = x0 + dayW / 2;
    // Grosszuegiger Abstand ueber/unter dem Icon: echte Farb-Emoji (Apple Color Emoji auf dem
    // iPhone, anders als der schmale Ersatzglyph im Chrome-Desktop-Test) fuellen ihre Zeile viel
    // hoeher/tiefer aus als normaler Text - bei gleichmaessigem Baseline-Abstand sass das Icon auf
    // dem echten Geraet fast ohne Luft an Wochentag und Temp-Range (Screenshot-Review).
    headers += `
      <text x="${cx}" y="${PAD + 12}" class="graph-wd" text-anchor="middle">${esc(label)}</text>
      <text x="${cx}" y="${PAD + 36}" class="graph-ico" text-anchor="middle">${icon}</text>
      <text x="${cx}" y="${PAD + 56}" class="graph-temp" text-anchor="middle">${esc(temps)}</text>`;
  });

  // --- Bestes Tagesfenster der gewaehlten Laenge (Slider 1, ADR-020; day.Windows[windowLen] ist
  // server-seitig vorberechnet, siehe BuildJson/ScoreModel.BestWindows): waagerechter Strich an
  // der Plot-Oberkante, Durchschnitt direkt darueber und ueber dem Strich zentriert (ADR-021) -
  // die Zahl gehoert visuell zum Fenster, nicht zum Tag, deshalb nicht mehr mittig als vierte
  // Kopfzeile. Eigene Schleife statt in die Kopfzeilen-Schleife oben verschachtelt - zwei
  // unabhaengige Belange (Tages-Kopfzeile vs. Fenster-Markierung), die sich sonst gegenseitig im
  // Weg stehen, sobald nur einer von beiden geaendert werden soll. ---
  const frac = hm => { const [hh, mm] = hm.split(':').map(Number); return (hh + mm / 60) / 24; };
  let bestWindowLines = '';
  days.forEach((dateStr, i) => {
    const day = crag.Days.find(d => d.Date === dateStr);
    const w = day && day.Windows && day.Windows[String(windowLen)];
    if (!w) return;
    const x0 = dayX(i);
    const xStart = x0 + frac(w.Start) * dayW, xEnd = x0 + frac(w.End) * dayW;
    bestWindowLines += `<line x1="${xStart}" y1="${PLOT_TOP}" x2="${xEnd}" y2="${PLOT_TOP}" class="graph-window-line"/>`;
    headers += `<text x="${(xStart + xEnd) / 2}" y="${SCORE_BASELINE}" class="graph-window-avg" text-anchor="middle">${w.MeanScore.toFixed(0)}</text>`;
  });

  // --- Score-Kurve: an echten Datenluecken (>1.5h Abstand, z.B. fehlende Forecast-Stunde) trennen
  // statt ueber die Luecke hinweg zu verbinden - sonst taeuscht die Linie Werte vor, die nie
  // berechnet wurden. Andere, groessere Schwelle als windowMean()s 1.01h (siehe dort) - bewusst,
  // nicht angleichen: hier geht es um visuelle Liniendurchgaengigkeit, dort um mathematische
  // Fenster-Korrektheit. ---
  const points = [];
  days.forEach((dateStr, i) => {
    (byDate[dateStr] || []).forEach(h => {
      const t = new Date(h.Time);
      const hourFrac = t.getHours() + t.getMinutes() / 60;
      points.push({ x: dayX(i) + (hourFrac / 24) * dayW, y: scoreY(h.Score), time: t });
    });
  });
  points.sort((a, b) => a.time - b.time);
  const segments = [];
  let current = [];
  points.forEach((p, i) => {
    if (i > 0 && (p.time - points[i - 1].time) > 1.5 * 3600 * 1000 && current.length) {
      segments.push(current);
      current = [];
    }
    current.push(p);
  });
  if (current.length) segments.push(current);
  const curve = segments
    .map(seg => `<polyline points="${seg.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" class="graph-curve"/>`)
    .join('');

  // --- Gewaehltes Fenster (Slider 2, ADR-020): global, liegt auf genau einem Tag - waagerechter
  // Strich an der Plot-Unterkante, Durchschnitt darunter (frueher stand hier der Mittelwert des
  // taeglichen Fensters, jetzt der des frei gewaehlten). selMean kommt fertig aus render()s
  // selCache statt hier erneut per windowMean() berechnet zu werden - derselbe Wert wird in
  // derselben render()-Runde auch fuer Sortierung und Kartenfarbe gebraucht. ---
  let selWindowLine = '', selWindowLabel = '';
  if (selStart) {
    const dIdx = days.indexOf(localDateStr(selStart));
    if (dIdx >= 0) {
      const x0 = dayX(dIdx);
      const startFrac = (selStart.getHours() + selStart.getMinutes() / 60) / 24;
      const xStart = x0 + startFrac * dayW, xEnd = x0 + (startFrac + windowLen / 24) * dayW;
      selWindowLine = `<line x1="${xStart}" y1="${PLOT_BOTTOM}" x2="${xEnd}" y2="${PLOT_BOTTOM}" class="graph-window-line"/>`;
      if (selMean != null) {
        selWindowLabel = `<text x="${(xStart + xEnd) / 2}" y="${PLOT_BOTTOM + 13}" text-anchor="middle" class="graph-window-avg">${selMean.toFixed(0)}</text>`;
      }
    }
  }

  // Reihenfolge bestimmt Ueberdeckung: Baender/Raster/bestes-Fenster-Strich zuerst, Kurve darueber
  // (staerker als alles andere), gewaehltes-Fenster-Strich/-Mittelwert und Kopfzeile obenauf.
  return `<svg class="graph" viewBox="0 0 ${GRAPH_W} ${GRAPH_H}">
    ${bands}${hgrid}${vgrid}${bestWindowLines}${curve}${selWindowLine}${selWindowLabel}${headers}
  </svg>`;
}

// Fuenf Stufen des Pflegeprozesses (CragProgress.EffectiveStatus in Models.cs), als Leiter mit
// erledigten/aktuellem/offenen Schritten gerendert - dieselbe Reihenfolge wie CragStatus.
const STATUS_STEPS = ['New', 'Located', 'Terrain', 'Tuned', 'Calibrated'];
const STATUS_GLOSS = {
  New: 'nur Name bekannt',
  Located: 'Koordinate verifiziert',
  Terrain: 'Gelände aus swissALTI3D',
  Tuned: 'Erfahrungswerte gesetzt',
  Calibrated: 'gegen Besuche kalibriert',
};

function renderLadder(crag) {
  const idx = STATUS_STEPS.indexOf(crag.Status);
  const steps = STATUS_STEPS.map((s, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'current' : '';
    return `<div class="step ${cls}" title="${esc(STATUS_GLOSS[s])}">
      <span class="dot"></span><span class="lbl">${esc(s)}</span></div>`;
  }).join('');
  // NextStep kommt fertig formatiert aus CragProgress (Models.cs, z.B. "-> --terrain") - das
  // Praefix hier abschneiden, sonst zeigt die Zeile den Pfeil doppelt.
  const nextText = crag.NextStep ? crag.NextStep.replace(/^->\s*/, '') : '';
  const next = nextText ? `<div class="step-next">→ Nächster Schritt: ${esc(nextText)}</div>` : '';
  return `<div class="status-block"><div class="ladder">${steps}</div>${next}</div>`;
}

// Gemessen (Klasse A, aus --terrain) + Erfahrungswerte (Klasse B, mit Herkunft) - dieselben zwei
// Boxen fuer die Kartendetailansicht UND das Karten-Popup (drawMap), damit beide Ansichten nie
// unterschiedliche Werte zeigen koennen.
function renderValueBoxes(crag) {
  const isGuess = crag.ExperienceSource === 'Guess';

  const measured = `
    <div class="measured">
      <span class="label">Terrain (${esc(crag.TerrainSource)})</span><br>
      Höhe ${crag.ElevationM != null ? crag.ElevationM + ' m' : '–'} ·
      Exposition ${crag.Aspect ? `${esc(crag.Aspect)} (${Math.round(crag.AspectDeg)}°)` : '–'} ·
      Horizont ${crag.HorizonDeg != null ? crag.HorizonDeg + '°' : '–'}<br>
      <span class="label">Standort (${esc(crag.CoordinateSource)})</span><br>
      Koordinaten ${crag.Lat != null ? `${crag.Lat.toFixed(5)}, ${crag.Lon.toFixed(5)}` : '–'}
    </div>`;

  const params = `
    <div class="params ${isGuess ? 'guess' : ''}">
      <span class="label">Erfahrungswerte</span><span class="src">${esc(crag.ExperienceSource)}</span><br>
      RainExposure ${crag.RainExposure} · TauBaseHours ${crag.TauBaseHours} ·
      SeepageProne ${crag.SeepageProne ? 'ja' : 'nein'} · SunHeatFactor ${crag.SunHeatFactor} ·
      CanopyShade ${esc(crag.CanopyShade)}
      ${isGuess ? '<br><em>ungeprüft – geraten, noch nicht gegen Beobachtung kalibriert</em>' : ''}
    </div>`;

  return measured + params;
}

function renderDetail(crag) {
  const note = crag.Note ? `<div class="card-note">${esc(crag.Note)}</div>` : '';

  const byDate = {};
  crag.Hours.forEach(h => {
    const d = h.Time.slice(0, 10);
    (byDate[d] ??= []).push(h);
  });

  const days = Object.keys(byDate).sort().map(d => `
    <div class="day-block">
      <h4>${new Date(d + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit' })}</h4>
      <table class="hours">
        <tr><th>Zeit</th><th>Score</th><th>Fels°C</th><th>f_temp</th><th>f_dry</th><th>f_hum</th><th>Nässe</th><th>Sonne</th></tr>
        ${byDate[d].map(h => `<tr>
          <td>${h.Time.slice(11, 16)}</td>
          <td class="${band(h.Score, 'pct')}">${h.Score.toFixed(0)}%</td>
          <td>${h.RockTempC.toFixed(1)}</td>
          <td class="${band(h.FTemp * 100, 'pct')}">${(h.FTemp * 100).toFixed(0)}%</td>
          <td class="${band(h.FDry * 100, 'pct')}">${(h.FDry * 100).toFixed(0)}%</td>
          <td class="${band(h.FHum * 100, 'pct')}">${(h.FHum * 100).toFixed(0)}%</td>
          <td>${h.WetnessMm.toFixed(2)}</td>
          <td>${h.SunOnWall ? '☀' : '·'}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('');

  return renderLadder(crag) + renderValueBoxes(crag) + note + days;
}

function render() {
  const list = document.getElementById('listView');
  // Einmal pro render()-Durchlauf berechnen (siehe Kommentar bei selCache oben) - Sortierung,
  // Graph-Label (renderGraph) und Kartenmarker (refreshMarkers, ganz unten) lesen alle denselben
  // Wert statt ihn je einzeln neu zu berechnen.
  selCache = new Map(data.Crags.map(c => [c.Idx, windowMean(c, selStart, windowLen)]));

  // Ungeprüfte (geratene) Crags gehoeren nicht in dieselbe Rangfolge wie beobachtete - ihr Score
  // ruht auf Default-Werten, nicht auf Erfahrung. Deshalb primär nach isGuess sortieren (Guess
  // immer zuletzt), erst innerhalb der beiden Gruppen nach dem Score des per Slider 2 gewaehlten
  // Fensters (ADR-020, ersetzt den frueheren Tagesfilter als Sortierkriterium) und bei Gleichstand
  // (z.B. beide ohne Daten im gewaehlten Fenster) nach dem besten Tagesfenster der aktuellen Laenge
  // ueber alle Tage - derselbe Tiebreak-Gedanke wie frueher in fitFor/bestScore, hier aus den
  // ohnehin gelieferten Days[].Windows gelesen statt erneut berechnet.
  const ranked = data.Crags
    .map(c => ({
      crag: c,
      isGuess: c.ExperienceSource === 'Guess',
      sel: selWindowScore(c),
      bestDayScore: c.Days.reduce((m, d) => Math.max(m, d.Windows?.[String(windowLen)]?.MeanScore ?? 0), 0),
    }))
    .sort((a, b) => (a.isGuess - b.isGuess) || (b.sel - a.sel) || (b.bestDayScore - a.bestDayScore));

  const renderCard = crag => {
    const isGuess = crag.ExperienceSource === 'Guess';
    const hasCoords = crag.Lat != null && crag.Lon != null;
    return `
    <div class="card ${isGuess ? 'guess' : ''}" id="crag-${crag.Idx}" data-name="${esc(crag.Name)}">
      <div class="card-head" onclick="toggleDetail(this)">
        <div>
          <div class="card-name">${esc(crag.Name)}
            ${hasCoords ? `<span class="jump-icon" title="Auf der Karte zeigen" onclick="event.stopPropagation(); focusCragOnMap(${crag.Idx})">🗺</span>` : ''}
            ${crag.Aspect ? `<span class="aspect" title="Exposition ${esc(crag.Aspect)} (${Math.round(crag.AspectDeg)}°)">
              <svg class="aspect-rock" viewBox="-6 -6 12 12" style="transform: rotate(${crag.AspectDeg}deg)"><path d="M -4.5 0 A 4.5 4.5 0 0 0 4.5 0 Z"/></svg>${esc(crag.Aspect)}</span>` : ''}</div>
        </div>
        <div class="caret">▾</div>
      </div>
      ${renderGraph(crag, selCache.get(crag.Idx))}
      <div class="detail">${renderDetail(crag)}</div>
    </div>`;
  };

  // Trennzeile zwischen geprueften und ungeprueften Crags einfuegen - nur wenn es von beiden
  // Sorten welche gibt, sonst wuerde eine leere Gruppe eine nutzlose Ueberschrift bekommen.
  const firstGuessIdx = ranked.findIndex(r => r.isGuess);
  const parts = [];
  ranked.forEach((r, i) => {
    if (i === firstGuessIdx && firstGuessIdx > 0) {
      parts.push(`<div class="group-sep">Ungeprüft (geraten) – noch nicht gegen Beobachtung kalibriert</div>`);
    }
    parts.push(renderCard(r.crag));
  });
  list.innerHTML = parts.join('');
  refreshMarkers();
}

window.toggleDetail = function (headEl) {
  const card = headEl.closest('.card');
  const detail = card.querySelector('.detail');
  const nowOpen = !detail.classList.contains('open');
  detail.classList.toggle('open', nowOpen);
  headEl.querySelector('.caret').textContent = nowOpen ? '▴' : '▾';
};

// --- Ansicht Liste/Karte: die Liste braucht Leaflet nie, die Karte laedt es erst beim ersten
// Umschalten - ein blockiertes/fehlendes CDN darf die Liste nicht beeintraechtigen. switchTab()
// ist eine benannte Funktion (statt eines anonymen Click-Handlers), damit auch die Spruung-Icons
// (Liste<->Karte je Crag) und das Burger-Menue im Header (ADR-020, ersetzt die frueheren
// Boden-Tabs) dieselbe Umschaltung ausloesen koennen.
let mapReady = false;
let mapInstance = null;
let markersByIdx = {};

// #mapView ist fixiert (kein Scrollen der Kartenansicht) und misst sich an dem, was tatsaechlich
// zwischen Seitenanfang (nach Header/Vorschau-Banner) und der unteren Slider-Leiste frei ist -
// top/bottom statt einer festen Hoehe, damit die Karte automatisch so gross wie moeglich bleibt,
// egal wie hoch Header/Banner gerade ausfallen.
function sizeMapView() {
  const top = document.querySelector('main').getBoundingClientRect().top;
  const bottom = window.innerHeight - document.querySelector('.sliders').getBoundingClientRect().top;
  const mapView = document.getElementById('mapView');
  mapView.style.top = Math.max(0, top) + 'px';
  mapView.style.bottom = Math.max(0, bottom) + 'px';
}
window.addEventListener('resize', () => {
  if (document.getElementById('mapView').style.display !== 'none') {
    sizeMapView();
    if (mapInstance) mapInstance.invalidateSize();
  }
});

function switchTab(name) {
  document.querySelectorAll('.menu-item').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  const isMap = name === 'map';
  document.getElementById('listView').style.display = isMap ? 'none' : '';
  document.getElementById('mapView').style.display = isMap ? '' : 'none';
  // <main> faellt bei ausgeblendeter Liste in sich zusammen (die fixierte Karte zaehlt nicht zum
  // Fluss) - der Footer wuerde sonst direkt unter den Header rutschen und dort nur deshalb
  // unsichtbar bleiben, weil die Karte optisch drueberliegt. Lieber explizit ausblenden statt sich
  // auf diese Zufaelligkeit der Stapelreihenfolge zu verlassen.
  document.querySelector('footer').style.display = isMap ? 'none' : '';
  // Seite darf nicht hinter der fixierten Karte wegscrollen - waehrend des Kartentabs bleibt sie
  // die einzige Interaktion (Pan/Zoom passiert in Leaflet selbst, nicht durch Seiten-Scroll).
  document.body.style.overflow = isMap ? 'hidden' : '';
  if (isMap) {
    sizeMapView();
    // mapReady wird schon in initMap() gesetzt (vor dem asynchronen Leaflet-Laden) - beim ERSTEN
    // Umschalten also initMap() anstossen, bei jedem weiteren invalidateSize(): die Karte war
    // zwischenzeitlich per display:none unsichtbar, Leaflet merkt eine Grössenaenderung des
    // eigenen Containers sonst nicht (klassische Leaflet-Falle, Ursache des Grau-Bugs beim
    // Sprung aus der Liste).
    if (!mapReady) initMap();
    else if (mapInstance) mapInstance.invalidateSize();
  }
}
// Burger-Menue: Klick auf den Button toggelt es, Klick auf einen Eintrag schaltet um und schliesst
// es wieder, ein Klick ausserhalb schliesst es ebenfalls (sonst bliebe es offen im Weg stehen).
const viewMenu = document.getElementById('viewMenu');
document.getElementById('burgerBtn').onclick = e => {
  e.stopPropagation();
  viewMenu.classList.toggle('open');
};
document.querySelectorAll('.menu-item').forEach(item => {
  item.onclick = () => { switchTab(item.dataset.tab); viewMenu.classList.remove('open'); };
});
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-wrap')) viewMenu.classList.remove('open');
});

// Springt von einer Crag-Karte in der Liste zur passenden Markierung auf der Karte - wartet per
// Poll auf mapInstance/den Marker, da initMap() Leaflet erst asynchron nachlaedt (mapReady wird
// dort synchron VOR dem Script-Load gesetzt, taugt also nicht als "Karte ist fertig"-Signal).
// Bricht nach ~8s ab, falls das CDN blockiert ist (dann greift showError() in initMap()).
let mapJumpPoll = null;
window.focusCragOnMap = function (idx) {
  switchTab('map');
  // Ein zweiter Klick (Doppeltipp) waehrend der erste Poll noch laeuft soll nicht zwei parallele
  // Intervalle aufziehen, die sich gegenseitig ueberholen - den laufenden Poll erst abbrechen.
  if (mapJumpPoll) clearInterval(mapJumpPoll);
  const tryFly = () => {
    const marker = markersByIdx[idx];
    if (!mapInstance || !marker) return false;
    mapInstance.setView(marker.getLatLng(), Math.max(mapInstance.getZoom(), 13));
    marker.openPopup();
    return true;
  };
  if (!tryFly()) {
    mapJumpPoll = setInterval(() => { if (tryFly()) clearInterval(mapJumpPoll); }, 60);
    setTimeout(() => clearInterval(mapJumpPoll), 8000);
  }
};

// Springt vom Karten-Popup zur passenden Karte in der Liste.
window.focusCragOnList = function (idx) {
  switchTab('list');
  const card = document.getElementById('crag-' + idx);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function initMap() {
  mapReady = true;
  const mapEl = document.getElementById('map');

  function showError() {
    mapEl.outerHTML = '<div class="map-msg" id="map">Karte nicht verfügbar (offline? unpkg.com blockiert?)</div>';
  }

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    try { drawMap(); } catch (e) { console.error(e); showError(); }
  };
  script.onerror = showError;
  document.body.appendChild(script);
}

// Kartenfarbe + Popup-Inhalt aus dem aktuell gewaehlten Fenster (Slider 2, ADR-020) - eigene
// Funktion, damit drawMap() (Erstaufbau) und refreshMarkers() (nach jeder Slider-Aenderung) nie
// auseinanderlaufen koennen.
function markerPresentation(c) {
  // Score des per Slider 2 gewaehlten Fensters - dieselbe 0..100-Skala wie die Stunden-Prozentwerte
  // und dieselbe Quelle wie die Listensortierung, damit die Kartenfarbe nie von der Reihenfolge in
  // der Liste abweicht.
  const avgBest = selWindowScore(c);
  const color = { 's-good': '#2e7d46', 's-fair': '#b98a1d', 's-poor': '#b0432f', 's-none': '#8a8072' }[band(avgBest, 's')];
  const popup = `<b>${esc(c.Name)} <span class="jump-icon" title="In der Liste zeigen" onclick="focusCragOnList(${c.Idx})">☰</span></b><br>Score ${avgBest.toFixed(0)}${c.Note ? `<br><span style="color:#666">${esc(c.Note)}</span>` : ''}${renderValueBoxes(c)}`;
  return { color, popup };
}

// Haelt Marker-Farbe/Popup aktuell, wenn sich das gewaehlte Fenster aendert - drawMap() baut die
// Marker nur beim ersten Kartenaufbau, ohne diesen Aufruf wuerden sie beim naechsten Kartenwechsel
// noch die Farbe eines laengst verlassenen Fensters zeigen (die Slider-Leiste liegt ueber der
// Karte, das waere besonders leicht zu uebersehen). Kein Aufwand, solange die Karte gar nicht
// aufgebaut ist (mapInstance noch null).
function refreshMarkers() {
  if (!mapInstance) return;
  data.Crags.forEach(c => {
    const marker = markersByIdx[c.Idx];
    if (!marker) return;
    const { color, popup } = markerPresentation(c);
    marker.setStyle({ fillColor: color });
    marker.setPopupContent(popup);
  });
}

function drawMap() {
  const located = data.Crags.filter(c => c.Lat != null && c.Lon != null);
  const center = located.length
    ? [located.reduce((s, c) => s + c.Lat, 0) / located.length,
       located.reduce((s, c) => s + c.Lon, 0) / located.length]
    : [47.45, 7.60];

  mapInstance = L.map('map').setView(center, located.length ? 12 : 10);

  // Drei Basiskarten wie im internen --map-Werkzeug (MapWriter.cs): OSM als Uebersicht, die
  // Swisstopo-Karten fuers Nachpruefen, ob ein Punkt wirklich auf der Wand sitzt und nicht auf
  // dem Plateau oder im Wald daneben.
  const swisstopoAttr = '&copy; <a href="https://www.swisstopo.admin.ch">swisstopo</a>';
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
  const pixelkarteLayer = L.tileLayer(
    'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom: 19, attribution: swisstopoAttr });
  const luftbildLayer = L.tileLayer(
    'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom: 19, attribution: swisstopoAttr });

  osmLayer.addTo(mapInstance);
  L.control.layers({ 'OpenStreetMap': osmLayer, 'Pixelkarte (swisstopo)': pixelkarteLayer,
                     'Luftbild (swisstopo)': luftbildLayer }).addTo(mapInstance);

  markersByIdx = {};
  located.forEach(c => {
    const { color, popup } = markerPresentation(c);
    const marker = L.circleMarker([c.Lat, c.Lon], { radius: 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95 })
      .addTo(mapInstance)
      .bindPopup(popup, { maxWidth: 260 });
    markersByIdx[c.Idx] = marker;
  });

  // Container kann beim allerersten Aufbau (schnell aus dem HTTP-Cache geladenes Leaflet-Script,
  // Groesse noch nicht final) knapp daneben liegen - hier zusaetzlich zu switchTab()s
  // invalidateSize() absichern, damit die Kacheln nie nur einen Teil der Flaeche fuellen. Erst
  // nach Layer/Markern statt direkt nach L.map(), damit auch deren Aufbau in die Neuberechnung
  // einfliesst statt nur die leere Karte.
  mapInstance.invalidateSize();
}

buildSliders();
render();
</script>
</body>
</html>
