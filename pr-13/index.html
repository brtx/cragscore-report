<style>

  .tab { flex: 1; padding: 9px; text-align: center; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); font-size: 14px; font-weight: 600;

  .tab.active { background: var(--rock); color: var(--paper); border-color: var(--rock); }

  .filters { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); font-size: 13px; color: var(--rock); cursor: pointer; }
  .chip.active { background: var(--rock); color: var(--paper); border-color: var(--rock); }
  .range { display: none; gap: 6px; align-items: center; padding: 0 16px 10px; font-size: 13px; }
  .range.open { display: flex; }
  .range input { font: inherit; }

  main { padding: 0 16px 40px; }
  #map { height: 70vh; border-radius: 8px; margin-top: 10px; }
  .map-msg { padding: 40px 16px; text-align: center; color: var(--mute); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card.guess { border-style: dashed; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline;
               cursor: pointer; gap: 8px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .badge-guess { display: inline-block; font-size: 10px; text-transform: uppercase;
                 letter-spacing: 0.04em; color: var(--guess); border: 1px solid var(--guess);
                 border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .card-note { color: var(--mute); font-size: 12px; margin-top: 10px; }
  .caret { color: var(--mute); font-size: 12px; align-self: center; }
  .aspect { display: inline-block; font-size: 10px; color: var(--mute); border: 1px solid var(--line);
            border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }

  .strip { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .day { flex: 0 0 auto; min-width: 64px; border-radius: 6px; padding: 5px 6px;
         font-size: 11px; text-align: center; color: #fff; opacity: 0.4; }
  .day.selected { opacity: 1; }
  .day .ico { font-size: 22px; line-height: 1.3; margin-bottom: 1px; }
  .day .d { font-size: 10px; text-transform: uppercase; opacity: 0.85; }
  .day .v { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .day .t { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.85; }
  .s-good { background: var(--good); }
  .s-fair { background: var(--fair); }
  .s-poor { background: var(--poor); }
  .s-none { background: var(--mute); }
  .pct-good { color: var(--good); font-weight: 700; }
  .pct-fair { color: var(--fair); font-weight: 700; }
  .pct-poor { color: var(--poor); font-weight: 700; }

  .detail { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .detail.open { display: block; }
  .day-block { margin-bottom: 10px; }
  .day-block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
                  color: var(--mute); margin: 0 0 4px; }
  table.hours { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.hours th, table.hours td { padding: 3px 5px; text-align: right; border-bottom: 1px solid var(--line); }
  table.hours th:first-child, table.hours td:first-child { text-align: left; }

  .params { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #f0ece2;
            font-size: 12px; }
  .params.guess { border: 1px dashed var(--guess); background: #fbf3e2; }
  .params .label { font-weight: 600; }
  .params .src { float: right; color: var(--guess); font-weight: 600; }
  .params.guess .src { color: var(--guess); }

  footer { padding: 10px 16px 40px; color: var(--mute); font-size: 12px; }

  .preview-banner { background: var(--guess); color: #fff; font-size: 12px; font-weight: 600;
                     text-align: center; padding: 6px 16px; letter-spacing: 0.02em; }
</style>

const esc = s => String(s ?? '').replace(/[&<>"]/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

// Eine einzige Definition von "was zaehlt als gut" - fuer Tages-Badges, Kartenmarker und die
// Prozentwerte in der Stunden-Detailtabelle gleichermassen (Prefix waehlt Hintergrund vs. Text).
function band(pct, prefix) {
  if (pct >= 70) return `${prefix}-good`;
  if (pct >= 40) return `${prefix}-fair`;
  if (pct > 0) return `${prefix}-poor`;
  return prefix === 's' ? 's-none' : `${prefix}-poor`;
}

document.getElementById('sub').textContent =
  `Erstellt ${new Date(data.GeneratedAt).toLocaleString('de-CH')} · Score = f_temp · f_hum · f_dry · ` +
  `Fenster ab Score ≥ ${data.DefaultScoreThreshold.toFixed(0)}`;

// --- Zeitfenster-Filter: tagesgenau (Chips waehlen eine Teilmenge von data.Days). Feinere
// Granularitaet (nur ein Nachmittag) wuerde FindWindows-Logik in JS nachbauen - siehe TODO.
let selectedDays = null;   // null = alle Tage

function isWeekend(dateStr) {
  const d = new Date(dateStr + 'T00:00:00').getDay();
  return d === 0 || d === 6;
}

function buildFilters() {
  const box = document.getElementById('filters');
  const chips = [
    { key: 'all', label: 'Alle', days: () => data.Days },
    { key: 'today', label: 'Heute', days: () => data.Days.slice(0, 1) },
    { key: 'tomorrow', label: 'Morgen', days: () => data.Days.slice(1, 2) },
    { key: 'weekend', label: 'Wochenende', days: () => data.Days.filter(isWeekend) },
    { key: 'range', label: 'Zeitraum...', days: () => selectedDays },
  ];
  box.innerHTML = '';
  let active = 'all';
  chips.forEach(c => {
    const el = document.createElement('span');
    el.className = 'chip' + (c.key === active ? ' active' : '');
    el.textContent = c.label;
    el.onclick = () => {
      [...box.children].forEach(ch => ch.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('range').classList.toggle('open', c.key === 'range');
      if (c.key !== 'range') {
        selectedDays = c.key === 'all' ? null : c.days();
        render();
      }
    };
    box.appendChild(el);
  });
}

document.getElementById('rangeFrom').min = data.Days[0] ?? '';
document.getElementById('rangeFrom').max = data.Days[data.Days.length - 1] ?? '';
document.getElementById('rangeTo').min = data.Days[0] ?? '';
document.getElementById('rangeTo').max = data.Days[data.Days.length - 1] ?? '';
document.getElementById('rangeApply').onclick = () => {
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  selectedDays = data.Days.filter(d => (!from || d >= from) && (!to || d <= to));
  render();
};

// --- Sortierung/Fit im gewaehlten Zeitraum: reine Arithmetik auf den vorberechneten
// DayFit-Werten - die eigentliche Score-Formel lebt nur in ScoreModel (C#), nicht hier.
function fitFor(crag, days) {
  const set = days ? new Set(days) : null;
  const relevant = crag.Days.filter(d => !set || set.has(d.Date));
  const fit = relevant.reduce((sum, d) => sum + d.DayFit, 0);
  const bestScore = relevant.reduce((m, d) => Math.max(m, d.BestScore ?? 0), 0);
  return { fit, bestScore };
}

// WMO-Wettercode (Open-Meteo &weather_code, dieselbe Klassifikation wie MeteoSchweiz) -> Symbol.
// Gruppiert grob nach WMO-Konvention: 0 klar, 1-3 zunehmend bewoelkt, 45/48 Nebel, 51-57 Niesel,
// 61-67 Regen, 71-77 Schnee, 80-82 Regenschauer, 85/86 Schneeschauer, 95-99 Gewitter.
function wmoIcon(code) {
  if (code == null) return '';
  if (code === 0) return '☀';
  if (code === 1) return '🌤';
  if (code === 2) return '⛅';
  if (code === 3) return '☁';
  if (code === 45 || code === 48) return '🌫';
  if (code >= 51 && code <= 57) return '🌦';
  if (code >= 61 && code <= 67) return '🌧';
  if (code >= 71 && code <= 77) return '❄';
  if (code >= 80 && code <= 82) return '🌦';
  if (code === 85 || code === 86) return '❄';
  if (code >= 95) return '⛈';
  return '';
}

function renderStrip(crag, days) {
  const set = days ? new Set(days) : null;
  return data.Days.map(dateStr => {
    const day = crag.Days.find(d => d.Date === dateStr);
    const selected = !set || set.has(dateStr);
    const label = new Date(dateStr + 'T00:00:00')
      .toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit' });
    if (!day) return `<div class="day s-none ${selected ? 'selected' : ''}">
      <div class="ico">&nbsp;</div><div class="d">${label}</div><div class="v">-</div><div class="t">&nbsp;</div></div>`;
    // Farbe nach BestScore (0..100, wie die Stunden-Prozentwerte) statt nach DayFit: DayFit ist auf
    // einen vollen 14h-Tag bei Score 100 normiert, ein reales 2h-Fenster bleibt damit fast immer
    // unter der "fair"-Schwelle, obwohl die Stunde selbst gut ist. DayFit bleibt fuer die Sortierung
    // (fitFor) massgeblich, nur die Farbe braucht die vergleichbare 0..100-Groesse.
    const dayBand = band(day.BestScore ?? 0, 's');
    let value;
    if (day.Windows.length > 0) {
      const w = day.Windows[0];
      value = `${w.Start.slice(0, 2)}–${w.End.slice(0, 2)}h`;
      if (day.Windows.length > 1) value += ' +';
    } else if (day.BestScore != null) {
      value = `max ${day.BestScore.toFixed(0)}`;
    } else {
      value = '–';
    }
    const icon = wmoIcon(day.WeatherCode);
    const temps = day.TempMin != null && day.TempMax != null
      ? `${Math.round(day.TempMin)}°/${Math.round(day.TempMax)}°` : '';
    return `<div class="day ${dayBand} ${selected ? 'selected' : ''}">
      <div class="ico">${icon || '&nbsp;'}</div>
      <div class="d">${esc(label)}</div><div class="v">${esc(value)}</div>
      <div class="t">${esc(temps) || '&nbsp;'}</div></div>`;
  }).join('');
}

function renderDetail(crag) {
  const byDate = {};
  crag.Hours.forEach(h => {
    const d = h.Time.slice(0, 10);
    (byDate[d] ??= []).push(h);
  });

  const days = Object.keys(byDate).sort().map(d => `
    <div class="day-block">
      <h4>${new Date(d + 'T00:00:00').toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit' })}</h4>
      <table class="hours">
        <tr><th>Zeit</th><th>Score</th><th>Fels°C</th><th>f_temp</th><th>f_hum</th><th>f_dry</th><th>Nässe</th><th>Sonne</th></tr>
        ${byDate[d].map(h => `<tr>
          <td>${h.Time.slice(11, 16)}</td>
          <td class="${band(h.Score, 'pct')}">${h.Score.toFixed(0)}%</td>
          <td>${h.RockTempC.toFixed(1)}</td>
          <td class="${band(h.FTemp * 100, 'pct')}">${(h.FTemp * 100).toFixed(0)}%</td>
          <td class="${band(h.FHum * 100, 'pct')}">${(h.FHum * 100).toFixed(0)}%</td>
          <td class="${band(h.FDry * 100, 'pct')}">${(h.FDry * 100).toFixed(0)}%</td>
          <td>${h.WetnessMm.toFixed(2)}</td>
          <td>${h.SunOnWall ? '☀' : '·'}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('');

  const isGuess = crag.ParamSource === 'Guess';
  const params = `
    <div class="params ${isGuess ? 'guess' : ''}">
      <span class="label">Erfahrungswerte</span><span class="src">${esc(crag.ParamSource)}</span><br>
      RainExposure ${crag.RainExposure} · TauBaseHours ${crag.TauBaseHours} ·
      SeepageProne ${crag.SeepageProne ? 'ja' : 'nein'} · SunHeatFactor ${crag.SunHeatFactor}
      ${isGuess ? '<br><em>ungeprüft – geraten, noch nicht gegen Beobachtung kalibriert</em>' : ''}
    </div>`;

  return days + params;
}

function render() {
  const list = document.getElementById('listView');
  const ranked = data.Crags
    .map(c => ({ crag: c, ...fitFor(c, selectedDays) }))
    .sort((a, b) => b.fit - a.fit || b.bestScore - a.bestScore);

  list.innerHTML = ranked.map(({ crag }) => {
    const isGuess = crag.ParamSource === 'Guess';
    return `
    <div class="card ${isGuess ? 'guess' : ''}" data-name="${esc(crag.Name)}">
      <div class="card-head" onclick="toggleDetail(this)">
        <div>
          <div class="card-name">${esc(crag.Name)}${isGuess ? '<span class="badge-guess">geraten</span>' : ''}
            ${crag.Aspect ? `<span class="aspect">${esc(crag.Aspect)}</span>` : ''}</div>
        </div>
        <div class="caret">▾</div>
      </div>
      <div class="strip">${renderStrip(crag, selectedDays)}</div>
      ${crag.Note ? `<div class="card-note">${esc(crag.Note)}</div>` : ''}
      <div class="detail">${renderDetail(crag)}</div>
    </div>`;
  }).join('');
}

window.toggleDetail = function (headEl) {
  const card = headEl.closest('.card');
  const detail = card.querySelector('.detail');
  const nowOpen = !detail.classList.contains('open');
  detail.classList.toggle('open', nowOpen);
  headEl.querySelector('.caret').textContent = nowOpen ? '▴' : '▾';
};

// --- Tabs: die Liste braucht Leaflet nie, die Karte laedt es erst beim ersten Umschalten -
// ein blockiertes/fehlendes CDN darf die Liste nicht beeintraechtigen.
let mapReady = false;
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isMap = tab.dataset.tab === 'map';
    document.getElementById('listView').style.display = isMap ? 'none' : '';
    document.getElementById('mapView').style.display = isMap ? '' : 'none';
    if (isMap && !mapReady) initMap();
  };
});

function initMap() {
  mapReady = true;
  const mapEl = document.getElementById('map');

  function showError() {
    mapEl.outerHTML = '<div class="map-msg" id="map">Karte nicht verfügbar (offline? unpkg.com blockiert?)</div>';
  }

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    try { drawMap(); } catch (e) { console.error(e); showError(); }
  };
  script.onerror = showError;
  document.body.appendChild(script);
}

function drawMap() {
  const located = data.Crags.filter(c => c.Lat != null && c.Lon != null);
  const center = located.length
    ? [located.reduce((s, c) => s + c.Lat, 0) / located.length,
       located.reduce((s, c) => s + c.Lon, 0) / located.length]
    : [47.45, 7.60];

  const map = L.map('map').setView(center, located.length ? 12 : 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

  located.forEach(c => {
    const set = selectedDays ? new Set(selectedDays) : null;
    const relevant = c.Days.filter(d => !set || set.has(d.Date));
    // Gleiche Ueberlegung wie beim Tages-Streifen: BestScore statt DayFit, damit die Kartenfarbe
    // dieselbe 0..100-Skala wie die Stunden-Prozentwerte nutzt.
    const avgBest = relevant.length ? relevant.reduce((s, d) => s + (d.BestScore ?? 0), 0) / relevant.length : 0;
    const color = { 's-good': '#2e7d46', 's-fair': '#b98a1d', 's-poor': '#b0432f', 's-none': '#8a8072' }[band(avgBest, 's')];

    L.circleMarker([c.Lat, c.Lon], { radius: 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95 })
      .addTo(map)
      .bindPopup(`<b>${esc(c.Name)}</b><br>Score ${avgBest.toFixed(0)}${c.Note ? `<br><span style="color:#666">${esc(c.Note)}</span>` : ''}`);
  });
}

buildFilters();
render();
</script>
</body>
</html>
